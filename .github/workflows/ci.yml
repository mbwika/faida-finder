name: CI

on:
  push:
    branches: [ main, collins-branch ]
  pull_request:
    branches: [ main, collins-branch ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test --silent -- --runInBand

      - name: Coverage
        run: npm run test:cov

  snyk-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk scans (auth required for Snyk Code)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          # Run Snyk only for pushes to main OR collins-branch, OR when SNYK_TOKEN is provided (e.g., configured in repo settings)
          if { [ "$GITHUB_EVENT_NAME" = "push" ] && { [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_REF" = "refs/heads/collins-branch" ]; }; } || [ -n "$SNYK_TOKEN" ]; then
            echo "Snyk conditions met. Proceeding with scans..."
          else
            echo "Not a main/collins push and SNYK_TOKEN not set; skipping Snyk scans.";
            exit 0;
          fi

          # Install jq for JSON parsing
          apt-get update && apt-get install -y jq

          # If no token, run unauthenticated Snyk test (SCA) only and upload results
          if [ -z "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN not set; running 'snyk test' only (may be limited).";
            snyk test --json > snyk-sca.json || true
            SCA_COUNT=$(jq '.vulnerabilities | length' snyk-sca.json 2>/dev/null || echo 0)
            if [ "$SCA_COUNT" -gt 0 ]; then
              echo "::error ::Snyk SCA found $SCA_COUNT issues"
            fi
            exit 0
          fi

          # Authenticated scans
          snyk auth "$SNYK_TOKEN"
          snyk code test --json > snyk-code.json || true
          snyk test --json > snyk-sca.json || true

          SCA_COUNT=$(jq '.vulnerabilities | length' snyk-sca.json 2>/dev/null || echo 0)
          CODE_COUNT=$(jq '.issues | length' snyk-code.json 2>/dev/null || echo 0)

          if [ "$SCA_COUNT" -gt 0 ] || [ "$CODE_COUNT" -gt 0 ]; then
            echo "::error ::Snyk found issues - SCA:$SCA_COUNT Code:$CODE_COUNT"
          else
            echo "No Snyk issues found"
          fi

      - name: Upload Snyk results
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results
          path: |
            snyk-sca.json
            snyk-code.json
